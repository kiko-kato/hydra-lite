[package]
name = "hydra-lite"
version = "2.0.0"
edition = "2021"
authors = ["Hydra Team <core@hydra-project.ru>"]
description = "High-performance adaptive AI API Gateway"
license = "MIT"

[[bin]]
name = "hydra-lite"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "stream", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "fast-rng"] }
sha2 = "0.10"
regex = "1.10"
